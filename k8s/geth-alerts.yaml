apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: geth-alerts
  labels:
    release: monitoring
spec:
  groups:
    - name: geth
      interval: 15s
      rules:
        - alert: GethBlockStalled
          expr: changes((max by (job) (chain_head_block{job="geth-dev"}))[2m:15s]) == 0
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: Geth 블록 생성 중단
            description: 최근 2분간 블록 높이 변화가 없는 상태가 1분간 지속됨.
        - alert: GethBlockStalledLong
          expr: changes((max by (job) (chain_head_block{job="geth-dev"}))[5m:15s]) == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: Geth 블록 생성 장기 중단
            description: 최근 5분간 블록 높이 변화가 없는 상태가 1분간 지속됨.
        - alert: GethDown
          expr: up{job="geth-dev"} == 0 or absent(up{job="geth-dev"})
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: Geth 메트릭 수집 실패
