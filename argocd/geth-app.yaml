apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: geth-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/jaesimin0903/bay-node-ops.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
